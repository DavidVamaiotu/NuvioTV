name: AutoSync TV Release

# Release trigger: eliminate duplicate fallback wait


on:
  workflow_dispatch:
  push:
    branches:
      - subtitle-autosync
    paths:
      - ".github/workflows/mirror-nuviotv-release.yml"
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

concurrency:
  group: autosync-tv-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AutoSync branch
        uses: actions/checkout@v6
        with:
          ref: subtitle-autosync
          fetch-depth: 0

      - name: Find latest official NuvioTV release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh api repos/NuvioMedia/NuvioTV/releases --jq '[.[] | select(.draft == false)][0]')"
          UPSTREAM_TAG="$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')"
          PRERELEASE="$(printf '%s' "$RELEASE_JSON" | jq -r '.prerelease')"

          if [[ -z "$UPSTREAM_TAG" || "$UPSTREAM_TAG" == "null" ]]; then
            echo "No official NuvioTV release found"
            exit 1
          fi

          if git log --format='%s' | grep -Fqx "Sync NuvioTV $UPSTREAM_TAG"; then
            NEEDS_SYNC=false
          else
            NEEDS_SYNC=true
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            # One-time optimized-release migration trigger; restored after publishing.
            SHOULD_RELEASE=true
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" && "$NEEDS_SYNC" != "true" ]]; then
            SHOULD_RELEASE=false
          else
            SHOULD_RELEASE=true
          fi

          BASE_TAG="${UPSTREAM_TAG#v}"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "needs_sync=$NEEDS_SYNC" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Nothing new
        if: steps.upstream.outputs.should_release != 'true'
        run: echo "Latest official NuvioTV release is already mirrored."

      - name: Configure Git
        if: steps.upstream.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Repair tied legacy release ordering
        if: steps.upstream.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          OLDER_TAG="1.0.0-autosync.9"
          NEWER_TAG="1.0.0-autosync.10"

          OLDER_SHA="$(git ls-remote origin "refs/tags/$OLDER_TAG" | awk '{print $1}')"
          NEWER_SHA="$(git ls-remote origin "refs/tags/$NEWER_TAG" | awk '{print $1}')"

          if [[ -n "$OLDER_SHA" && "$OLDER_SHA" == "$NEWER_SHA" ]]; then
            echo "$OLDER_TAG and $NEWER_TAG point to the same commit; moving only $NEWER_TAG to the current workflow-fix commit so GitHub can order them correctly."
            git tag -f "$NEWER_TAG" HEAD
            git push --force origin "refs/tags/$NEWER_TAG"
          else
            echo "Legacy release ordering already normalized."
          fi

          # GitHub can retain the old release-list position after a tag is moved.
          # Re-publish only when the API still shows .10 below .9 even though its
          # created_at is newer. This keeps assets intact and does not change Latest.
          RELEASES_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20")"
          INDEX_10="$(printf '%s' "$RELEASES_JSON" | jq -r 'to_entries[] | select(.value.tag_name=="1.0.0-autosync.10") | .key')"
          INDEX_9="$(printf '%s' "$RELEASES_JSON" | jq -r 'to_entries[] | select(.value.tag_name=="1.0.0-autosync.9") | .key')"
          CREATED_10="$(printf '%s' "$RELEASES_JSON" | jq -r '.[] | select(.tag_name=="1.0.0-autosync.10") | .created_at')"
          CREATED_9="$(printf '%s' "$RELEASES_JSON" | jq -r '.[] | select(.tag_name=="1.0.0-autosync.9") | .created_at')"

          if [[ -n "$INDEX_10" && -n "$INDEX_9" && -n "$CREATED_10" && -n "$CREATED_9" ]] &&
             (( INDEX_10 > INDEX_9 )) &&
             [[ "$CREATED_10" > "$CREATED_9" ]]; then
            RELEASE_ID="$(printf '%s' "$RELEASES_JSON" | jq -r '.[] | select(.tag_name=="1.0.0-autosync.10") | .id')"
            echo "Refreshing $NEWER_TAG release index without changing its assets or Latest status."
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F prerelease=true -f make_latest=false >/dev/null
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F prerelease=false -f make_latest=false >/dev/null
          fi

      - name: Fetch official NuvioTV release
        if: steps.upstream.outputs.should_release == 'true' && steps.upstream.outputs.needs_sync == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/NuvioMedia/NuvioTV.git
          git fetch upstream "refs/tags/$UPSTREAM_TAG:refs/tags/nuvio-$UPSTREAM_TAG"

      - name: Merge official release
        if: steps.upstream.outputs.should_release == 'true' && steps.upstream.outputs.needs_sync == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
        run: |
          git merge --squash "refs/tags/nuvio-$UPSTREAM_TAG"
          git restore --source=HEAD --staged --worktree .github/workflows

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Sync NuvioTV $UPSTREAM_TAG"
          fi

      - name: Choose next AutoSync revision
        if: steps.upstream.outputs.should_release == 'true'
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_TAG: ${{ steps.upstream.outputs.base_tag }}
        run: |
          set -euo pipefail

          MAX_REVISION=0
          while IFS= read -r TAG; do
            if [[ "$TAG" =~ ^${BASE_TAG}-autosync[.]([0-9]+)$ ]]; then
              REVISION="${BASH_REMATCH[1]}"
              if (( REVISION > MAX_REVISION )); then
                MAX_REVISION="$REVISION"
              fi
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')

          NEXT_REVISION=$(( MAX_REVISION + 1 ))
          AUTOSYNC_TAG="${BASE_TAG}-autosync.${NEXT_REVISION}"

          BRIDGE_TAG=""
          if [[ "$BASE_TAG" == "1.0.0" ]]; then
            if ! gh release view "1.0.1-autosync" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              BRIDGE_TAG="1.0.1-autosync"
            fi
          fi

          PREVIOUS_TAG=""
          if (( MAX_REVISION > 0 )); then
            PREVIOUS_TAG="${BASE_TAG}-autosync.${MAX_REVISION}"
          fi

          echo "revision=$NEXT_REVISION" >> "$GITHUB_OUTPUT"
          echo "tag=$AUTOSYNC_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "bridge_tag=$BRIDGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.upstream.outputs.should_release == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.upstream.outputs.should_release == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Nuvio services
        if: steps.upstream.outputs.should_release == 'true'
        env:
          SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          SUPABASE_FALLBACK: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -e
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          cat > local.properties <<EOF2
          NUVIO_SUPABASE_URL=$SUPABASE_URL
          NUVIO_SUPABASE_ANON_KEY=$SUPABASE_KEY
          NUVIO_SUPABASE_FALLBACK_URL=$SUPABASE_FALLBACK
          TMDB_API_KEY=$TMDB_API_KEY
          TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login
          DEVICE_LOGIN_WEB_BASE_URL=https://nuvio.tv/link
          AVATAR_PUBLIC_BASE_URL=${SUPABASE_URL%/}/storage/v1/object/public/avatars
          NUVIO_UPDATE_GITHUB_OWNER=DavidVamaiotu
          NUVIO_UPDATE_GITHUB_REPO=NuvioTV
          AUTOSYNC_FORK=true
          SIMKL_CLIENT_ID=dc20e0db975583b15096267cee79cd23b1f56d4bd301ce3c51e4a96a49c834a6
          SIMKL_APP_NAME=nuvio
          INTRODB_API_URL=https://api.introdb.app/
          IMDB_RATINGS_API_BASE_URL=https://seriesgraph.com/
          IMDB_TAPFRAME_API_BASE_URL=https://imdb.tapframe.space/
          EOF2

          cp local.properties local.dev.properties

      - name: Configure persistent signing
        if: steps.upstream.outputs.should_release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOSYNC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AUTOSYNC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTOSYNC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUTOSYNC_KEY_PASSWORD }}
        run: |
          set -e
          KEYSTORE_PATH="$RUNNER_TEMP/autosync-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            echo "NUVIO_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Stamp canonical AutoSync version
        if: steps.upstream.outputs.should_release == 'true'
        env:
          AUTOSYNC_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          AUTOSYNC_VERSION_CODE="$(date +%s)"
          export AUTOSYNC_VERSION_CODE AUTOSYNC_TAG

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()
          version_name = os.environ["AUTOSYNC_TAG"]
          version_code = os.environ["AUTOSYNC_VERSION_CODE"]

          text, code_count = re.subn(
              r'versionCode[ 	]*=[ 	]*[0-9]+',
              f'versionCode = {version_code}',
              text,
              count=1,
          )
          text, name_count = re.subn(
              r'versionName[ 	]*=[ 	]*"[^"]+"',
              f'versionName = "{version_name}"',
              text,
              count=1,
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not stamp AutoSync version")

          path.write_text(text)
          PY

          grep -nE 'version(Code|Name)[[:space:]]*=' app/build.gradle.kts | head -n 2

      - name: Test updater and build AutoSync APK
        if: steps.upstream.outputs.should_release == 'true'
        run: ./gradlew :app:testFullReleaseUnitTest --tests 'com.nuvio.tv.updater.*' :app:assembleFullRelease --build-cache --stacktrace

      - name: Prepare APKs
        if: steps.upstream.outputs.should_release == 'true'
        env:
          AUTOSYNC_TAG: ${{ steps.version.outputs.tag }}
          BRIDGE_TAG: ${{ steps.version.outputs.bridge_tag }}
        run: |
          set -euo pipefail
          SOURCE_DIR="app/build/outputs/apk/full/release"

          for ABI in universal arm64-v8a armeabi-v7a x86_64 x86; do
            SOURCE="$SOURCE_DIR/app-full-${ABI}-release.apk"
            TARGET="NuvioTV-AutoSync-${AUTOSYNC_TAG}-${ABI}.apk"
            test -f "$SOURCE"
            cp "$SOURCE" "$TARGET"
          done

          if [[ -n "$BRIDGE_TAG" ]]; then
            cp "$SOURCE_DIR/app-full-universal-release.apk" "NuvioTV-AutoSync-${BRIDGE_TAG}-universal.apk"
          fi

      - name: Verify in-place update compatibility
        if: steps.upstream.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOSYNC_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail

          NEW_APK="NuvioTV-AutoSync-${AUTOSYNC_TAG}-arm64-v8a.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          read_badging() {
            "$AAPT" dump badging "$1" | head -n 1
          }

          NEW_BADGING="$(read_badging "$NEW_APK")"
          NEW_PACKAGE="$(printf '%s\n' "$NEW_BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          NEW_VERSION="$(printf '%s\n' "$NEW_BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          echo "New APK identity: package=$NEW_PACKAGE versionCode=$NEW_VERSION"
          test "$NEW_PACKAGE" = "com.nuviodebug.com"

          if [[ -n "$PREVIOUS_TAG" ]]; then
            mkdir -p previous
            gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*arm64-v8a.apk' --dir previous
            PREVIOUS_APK="$(find previous -maxdepth 1 -type f -name '*.apk' | head -n 1)"
            test -n "$PREVIOUS_APK"

            OLD_BADGING="$(read_badging "$PREVIOUS_APK")"
            OLD_PACKAGE="$(printf '%s\n' "$OLD_BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
            OLD_VERSION="$(printf '%s\n' "$OLD_BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
            echo "Previous APK identity: package=$OLD_PACKAGE versionCode=$OLD_VERSION"

            read_cert_digest() {
              local apk="$1"
              "$APKSIGNER" verify --print-certs "$apk" 2>&1 |
                sed -nE 's/.*certificate SHA-256 digest:[[:space:]]*([^[:space:]]+).*/\1/p' |
                head -n 1
            }

            NEW_CERT="$(read_cert_digest "$NEW_APK")"
            OLD_CERT="$(read_cert_digest "$PREVIOUS_APK")"

            if [[ -z "$NEW_CERT" || -z "$OLD_CERT" ]]; then
              echo "Could not read APK signing certificate digest." >&2
              echo "New APK certificate output:" >&2
              "$APKSIGNER" verify --print-certs "$NEW_APK" >&2 || true
              echo "Previous APK certificate output:" >&2
              "$APKSIGNER" verify --print-certs "$PREVIOUS_APK" >&2 || true
              exit 1
            fi

            echo "Signing certificate unchanged: $([[ "$OLD_CERT" = "$NEW_CERT" ]] && echo yes || echo no)"
            test "$OLD_PACKAGE" = "$NEW_PACKAGE"
            test "$OLD_CERT" = "$NEW_CERT"
            (( NEW_VERSION > OLD_VERSION ))
          fi

          echo "Verified update identity: package=$NEW_PACKAGE versionCode=$NEW_VERSION"

      - name: Commit canonical release anchor
        if: steps.upstream.outputs.should_release == 'true'
        env:
          AUTOSYNC_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail

          # Persist the exact version metadata used by this build. More importantly,
          # this guarantees every canonical release has its own commit timestamp;
          # GitHub orders releases by the tagged commit date, not publish time.
          git add app/build.gradle.kts
          if git diff --cached --quiet; then
            git commit --allow-empty -m "Release $AUTOSYNC_TAG"
          else
            git commit -m "Release $AUTOSYNC_TAG"
          fi

          if [[ -n "$PREVIOUS_TAG" ]]; then
            PREVIOUS_SHA="$(git rev-list -n 1 "$PREVIOUS_TAG")"
            CURRENT_SHA="$(git rev-parse HEAD)"
            if [[ "$CURRENT_SHA" == "$PREVIOUS_SHA" ]]; then
              echo "Release anchor unexpectedly matches previous release commit." >&2
              exit 1
            fi
          fi

          git push origin HEAD:subtitle-autosync

      - name: Create canonical AutoSync release
        if: steps.upstream.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
          AUTOSYNC_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.upstream.outputs.prerelease }}
        run: |
          set -euo pipefail
          APK_UNIVERSAL="NuvioTV-AutoSync-${AUTOSYNC_TAG}-universal.apk"
          APK_ARM64="NuvioTV-AutoSync-${AUTOSYNC_TAG}-arm64-v8a.apk"
          APK_V7A="NuvioTV-AutoSync-${AUTOSYNC_TAG}-armeabi-v7a.apk"
          APK_X86_64="NuvioTV-AutoSync-${AUTOSYNC_TAG}-x86_64.apk"
          APK_X86="NuvioTV-AutoSync-${AUTOSYNC_TAG}-x86.apk"

          # Keep universal first for compatibility with older clients that may
          # simply use the first APK. ABI-aware clients select the exact match.
          ARGS=(
            "$AUTOSYNC_TAG"
            "$APK_UNIVERSAL"
            "$APK_ARM64"
            "$APK_V7A"
            "$APK_X86_64"
            "$APK_X86"
            --repo "$GITHUB_REPOSITORY"
            --target "$(git rev-parse HEAD)"
            --title "$AUTOSYNC_TAG"
            --notes "AutoSync TV revision $AUTOSYNC_TAG based on official NuvioTV $UPSTREAM_TAG. Includes AutoSync V2."
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          ARGS+=(--latest=false)
          gh release create "${ARGS[@]}"

      - name: Create one-time updater bridge
        if: steps.upstream.outputs.should_release == 'true' && steps.version.outputs.bridge_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.upstream_tag }}
          AUTOSYNC_TAG: ${{ steps.version.outputs.tag }}
          BRIDGE_TAG: ${{ steps.version.outputs.bridge_tag }}
        run: |
          set -euo pipefail
          APK="NuvioTV-AutoSync-${BRIDGE_TAG}-universal.apk"
          gh release create "$BRIDGE_TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "$BRIDGE_TAG" --latest --notes "Compatibility bridge for existing AutoSync 1.0.0 installs. The APK itself is canonical $AUTOSYNC_TAG, based on official NuvioTV $UPSTREAM_TAG. Future AutoSync releases use upstream-version-autosync.revision."

      - name: Keep legacy updater bridge latest
        if: github.event_name == 'push' || steps.upstream.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "1.0.1-autosync" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "1.0.1-autosync" --repo "$GITHUB_REPOSITORY" --latest
          fi
