name: AutoSync TV Remove Legacy Releases

# One-time cleanup: delete the pre-revision releases and the 1.0.1-autosync
# updater bridge (with their tags), then mark the newest stable release latest.
# Remove this workflow once it has run.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest

    steps:
      - name: Delete legacy releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for TAG in 1.0.1-autosync 1.0.0-autosync 0.9.5-beta-autosync; do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              echo "Deleted release and tag $TAG"
            elif gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
              echo "Deleted tag $TAG"
            else
              echo "$TAG already gone"
            fi
          done

  mark_latest:
    needs: remove
    uses: ./.github/workflows/autosync-mark-latest.yml
    secrets: inherit
