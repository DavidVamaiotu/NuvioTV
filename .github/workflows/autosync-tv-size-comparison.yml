name: AutoSync TV Size Comparison

on:
  push:
    branches:
      - subtitle-autosync
    paths:
      - ".github/workflows/autosync-tv-size-comparison.yml"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    env:
      CI_USE_DEBUG_SIGNING: "true"
      NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
      NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
      NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Configure services
        run: |
          cat > local.properties <<EOF
          NUVIO_SUPABASE_URL=$NUVIO_SUPABASE_URL
          NUVIO_SUPABASE_ANON_KEY=$NUVIO_SUPABASE_ANON_KEY
          NUVIO_SUPABASE_FALLBACK_URL=$NUVIO_SUPABASE_FALLBACK_URL
          TMDB_API_KEY=$TMDB_API_KEY
          NUVIO_UPDATE_GITHUB_OWNER=DavidVamaiotu
          NUVIO_UPDATE_GITHUB_REPO=NuvioTV
          AUTOSYNC_FORK=true
          SIMKL_CLIENT_ID=dc20e0db975583b15096267cee79cd23b1f56d4bd301ce3c51e4a96a49c834a6
          SIMKL_APP_NAME=nuvio
          INTRODB_API_URL=https://api.introdb.app/
          IMDB_RATINGS_API_BASE_URL=https://seriesgraph.com/
          IMDB_TAPFRAME_API_BASE_URL=https://imdb.tapframe.space/
          EOF
          cp local.properties local.dev.properties

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleFullDebug :app:assembleFullRelease --build-cache --stacktrace

      - name: Compare APK sizes
        run: |
          echo "=== DEBUG ==="
          find app/build/outputs/apk/full/debug -maxdepth 1 -type f -name '*.apk' -printf '%f %s\n' | sort
          echo "=== RELEASE ==="
          find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' -printf '%f %s\n' | sort
