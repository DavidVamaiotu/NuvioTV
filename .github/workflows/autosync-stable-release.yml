name: AutoSync TV Stable Release

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: autosync-tv-stable-release
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish stable AutoSync TV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stable AutoSync branch
        uses: actions/checkout@v6
        with:
          ref: subtitle-autosync-stable
          fetch-depth: 0

      - name: Choose next stable AutoSync revision
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_TAG="1.0.0"
          MAX_REVISION=0

          while IFS= read -r TAG; do
            if [[ "$TAG" =~ ^1[.]0[.]0-autosync[.]([0-9]+)$ ]]; then
              REVISION="${BASH_REMATCH[1]}"
              if (( REVISION > MAX_REVISION )); then
                MAX_REVISION="$REVISION"
              fi
            fi
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name'
          )

          NEXT_REVISION=$(( MAX_REVISION + 1 ))
          AUTOSYNC_TAG="${BASE_TAG}-autosync.${NEXT_REVISION}"
          PREVIOUS_TAG=""
          if (( MAX_REVISION > 0 )); then
            PREVIOUS_TAG="${BASE_TAG}-autosync.${MAX_REVISION}"
          fi

          echo "tag=$AUTOSYNC_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "Stable AutoSync release: $AUTOSYNC_TAG"

      - name: Generate stable changelog
        env:
          AUTOSYNC_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          # Hand-written highlights come from the stable branch's notes file, shown only when it
          # changed since the previous stable release so old notes never repeat.
          NOTES_FILE=".github/autosync-release-notes.md"
          HAS_PREVIOUS=false
          if [[ -n "$PREVIOUS_TAG" ]] && git rev-parse --verify --quiet "$PREVIOUS_TAG^{commit}" >/dev/null; then
            HAS_PREVIOUS=true
          fi

          {
            echo "## AutoSync TV stable changelog"
            echo
            echo "Built on the **stable NuvioTV 1.0.0 base**. It does not include NuvioTV 1.1.0 beta features."
            echo
            if [[ -s "$NOTES_FILE" ]] && {
              [[ "$HAS_PREVIOUS" != "true" ]] || ! git diff --quiet "$PREVIOUS_TAG" HEAD -- "$NOTES_FILE"
            }; then
              echo "### Highlights"
              echo
              cat "$NOTES_FILE"
              echo
            fi
            if [[ "$HAS_PREVIOUS" == "true" ]]; then
              CHANGES="$(
                git log --reverse --no-merges --first-parent --pretty=format:'%s' "$PREVIOUS_TAG..HEAD" -- . \
                  ':(exclude).github/workflows/**' ':(exclude).github/autosync-release-notes.md' |
                  grep -Ev '^(Trigger .*AutoSync|Release .*autosync|Sync NuvioTV )' || true
              )"
              if [[ -n "$CHANGES" ]]; then
                echo "### Commits"
                echo
                while IFS= read -r line; do
                  printf -- '- %s\n' "$line"
                done <<< "$CHANGES"
                echo
              fi
            fi
            echo "Base: official **NuvioTV 1.0.0**"
            echo "Release: **$AUTOSYNC_TAG**"
          } > release-notes.md

          cat release-notes.md

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Nuvio services
        env:
          SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          SUPABASE_FALLBACK: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -e
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

          cat > local.properties <<EOF
          NUVIO_SUPABASE_URL=$SUPABASE_URL
          NUVIO_SUPABASE_ANON_KEY=$SUPABASE_KEY
          NUVIO_SUPABASE_FALLBACK_URL=$SUPABASE_FALLBACK
          TMDB_API_KEY=$TMDB_API_KEY
          TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login
          DEVICE_LOGIN_WEB_BASE_URL=https://nuvio.tv/link
          AVATAR_PUBLIC_BASE_URL=${SUPABASE_URL%/}/storage/v1/object/public/avatars
          NUVIO_UPDATE_GITHUB_OWNER=DavidVamaiotu
          NUVIO_UPDATE_GITHUB_REPO=NuvioTV
          AUTOSYNC_FORK=true
          SIMKL_CLIENT_ID=dc20e0db975583b15096267cee79cd23b1f56d4bd301ce3c51e4a96a49c834a6
          SIMKL_APP_NAME=nuvio
          INTRODB_API_URL=https://api.introdb.app/
          IMDB_RATINGS_API_BASE_URL=https://seriesgraph.com/
          IMDB_TAPFRAME_API_BASE_URL=https://imdb.tapframe.space/
          EOF

          cp local.properties local.dev.properties

      - name: Add Seekr API key
        env:
          SEEKR_API_KEY: ${{ secrets.SEEKR_API_KEY }}
        run: |
          # Seek-preview thumbnails stay off in builds without the secret.
          if [[ -n "$SEEKR_API_KEY" ]]; then
            printf '\nSEEKR_API_KEY=%s\n' "$SEEKR_API_KEY" >> local.properties
          else
            echo "::warning::SEEKR_API_KEY secret is not set; seek previews are disabled in this build"
          fi

      - name: Add Trakt credentials
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          # Trakt login stays unavailable in builds without both secrets.
          if [[ -n "$TRAKT_CLIENT_ID" && -n "$TRAKT_CLIENT_SECRET" ]]; then
            printf '\nTRAKT_CLIENT_ID=%s\nTRAKT_CLIENT_SECRET=%s\n' "$TRAKT_CLIENT_ID" "$TRAKT_CLIENT_SECRET" >> local.properties
          else
            echo "::warning::TRAKT_CLIENT_ID or TRAKT_CLIENT_SECRET secret is not set; Trakt login is disabled in this build"
          fi

      - name: Add MDBList client ID
        env:
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
        run: |
          # MDBList sign-in and tracking stay unavailable in builds without the secret.
          if [[ -n "$MDBLIST_CLIENT_ID" ]]; then
            printf '\nMDBLIST_CLIENT_ID=%s\n' "$MDBLIST_CLIENT_ID" >> local.properties
          else
            echo "::warning::MDBLIST_CLIENT_ID secret is not set; MDBList sign-in is disabled in this build"
          fi

      - name: Configure persistent signing
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOSYNC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AUTOSYNC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTOSYNC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUTOSYNC_KEY_PASSWORD }}
        run: |
          set -e
          KEYSTORE_PATH="$RUNNER_TEMP/autosync-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          {
            echo "NUVIO_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Stamp stable AutoSync version
        env:
          AUTOSYNC_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          AUTOSYNC_VERSION_CODE="$(date +%s)"
          export AUTOSYNC_VERSION_CODE AUTOSYNC_TAG

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()
          version_name = os.environ["AUTOSYNC_TAG"]
          version_code = os.environ["AUTOSYNC_VERSION_CODE"]

          text, code_count = re.subn(
              r'versionCode[ \t]*=[ \t]*[0-9]+',
              f'versionCode = {version_code}',
              text,
              count=1,
          )
          text, name_count = re.subn(
              r'versionName[ \t]*=[ \t]*"[^"]+"',
              f'versionName = "{version_name}"',
              text,
              count=1,
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not stamp stable AutoSync version")

          path.write_text(text)
          PY

      - name: Test AutoSync and updater, then build Nuvio RS APKs
        env:
          AUTOSYNC_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ./gradlew :app:testFullReleaseUnitTest --tests 'com.nuvio.tv.updater.*' --tests 'com.nuvio.tv.ui.screens.player.autosync.*' --build-cache --stacktrace
          .github/scripts/reshaped-tv-apks.sh build "$AUTOSYNC_TAG"

      - name: Verify stable update compatibility
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOSYNC_TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: .github/scripts/reshaped-tv-apks.sh verify "$AUTOSYNC_TAG" "$PREVIOUS_TAG"

      - name: Publish stable AutoSync release
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOSYNC_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t APKS < <(.github/scripts/reshaped-tv-apks.sh list "$AUTOSYNC_TAG")
          gh release create "$AUTOSYNC_TAG" "${APKS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "$AUTOSYNC_TAG" \
            --notes-file release-notes.md \
            --latest=false

  mark_latest:
    needs: release
    uses: ./.github/workflows/autosync-mark-latest.yml
    secrets: inherit
