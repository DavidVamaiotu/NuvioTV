name: Nuvio RS rename CI (temporary)

on:
  push:
    branches:
      - reshaped-rename

permissions:
  contents: read

concurrency:
  group: reshaped-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: AutoSync build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure Nuvio services
        env:
          SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          SUPABASE_FALLBACK: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
        run: |
          set -e

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_KEY" ]]; then
            echo "Nuvio login configuration is missing."
            exit 1
          fi

          cat > local.properties <<EOF2
          NUVIO_SUPABASE_URL=$SUPABASE_URL
          NUVIO_SUPABASE_ANON_KEY=$SUPABASE_KEY
          NUVIO_SUPABASE_FALLBACK_URL=$SUPABASE_FALLBACK

          TV_LOGIN_WEB_BASE_URL=https://nuvio.tv/tv-login
          DEVICE_LOGIN_WEB_BASE_URL=https://nuvio.tv/link

          AVATAR_PUBLIC_BASE_URL=${SUPABASE_URL%/}/storage/v1/object/public/avatars

          NUVIO_UPDATE_GITHUB_OWNER=DavidVamaiotu
          NUVIO_UPDATE_GITHUB_REPO=NuvioTV
          AUTOSYNC_FORK=true

          SIMKL_CLIENT_ID=dc20e0db975583b15096267cee79cd23b1f56d4bd301ce3c51e4a96a49c834a6
          SIMKL_APP_NAME=nuvio

          INTRODB_API_URL=https://api.introdb.app/
          IMDB_RATINGS_API_BASE_URL=https://seriesgraph.com/
          IMDB_TAPFRAME_API_BASE_URL=https://imdb.tapframe.space/
          EOF2

          cp local.properties local.dev.properties

      - name: Add Seekr API key
        env:
          SEEKR_API_KEY: ${{ secrets.SEEKR_API_KEY }}
        run: |
          # Seek-preview thumbnails stay off in builds without the secret.
          if [[ -n "$SEEKR_API_KEY" ]]; then
            printf '\nSEEKR_API_KEY=%s\n' "$SEEKR_API_KEY" >> local.properties
          else
            echo "::warning::SEEKR_API_KEY secret is not set; seek previews are disabled in this build"
          fi

      - name: Add Trakt credentials
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
        run: |
          # Trakt login stays unavailable in builds without both secrets.
          if [[ -n "$TRAKT_CLIENT_ID" && -n "$TRAKT_CLIENT_SECRET" ]]; then
            printf '\nTRAKT_CLIENT_ID=%s\nTRAKT_CLIENT_SECRET=%s\n' "$TRAKT_CLIENT_ID" "$TRAKT_CLIENT_SECRET" >> local.properties
          else
            echo "::warning::TRAKT_CLIENT_ID or TRAKT_CLIENT_SECRET secret is not set; Trakt login is disabled in this build"
          fi

      - name: Configure persistent AutoSync signing
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOSYNC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AUTOSYNC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTOSYNC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUTOSYNC_KEY_PASSWORD }}
        run: |
          set -e

          KEYSTORE_PATH="$RUNNER_TEMP/autosync-release.jks"

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          {
            echo "NUVIO_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testFullReleaseUnitTest --tests 'com.nuvio.tv.updater.*' --tests 'com.nuvio.tv.ui.screens.player.autosync.*' --build-cache --stacktrace

      - name: Build Nuvio RS and bridge APKs
        run: .github/scripts/reshaped-tv-apks.sh build 1.1.0-beta.1-autosync.99

      - name: Verify against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Version codes are not stamped here, so only the identity checks are meaningful.
          .github/scripts/reshaped-tv-apks.sh verify 1.1.0-beta.1-autosync.99
          PREVIOUS="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
          source .github/scripts/reshaped-tv-apks.sh true
          tools
          old="$(download_previous "$PREVIOUS" previous-legacy '*bridge-universal.apk' '*arm64-v8a.apk')"
          echo "previous $PREVIOUS: $(package_of "$old") cert $(cert_of "$old")"
          echo "bridge: $(package_of release-apks/*bridge-universal.apk) cert $(cert_of release-apks/*bridge-universal.apk)"
          test "$(cert_of "$old")" = "$(cert_of release-apks/*bridge-universal.apk)"
          test "$(package_of "$old")" = "$(package_of release-apks/*bridge-universal.apk)"

      - name: Inspect APKs
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)"
          for apk in release-apks/*.apk; do
            echo "== $apk"
            "$AAPT2" dump badging "$apk" | grep -E "^package:|^application-label|^application-label-(fr|ta|ru):|^native-code:"
            "$AAPT2" dump xmltree --file AndroidManifest.xml "$apk" | grep -E "reshaped|MIGRATE|DELETE_PACKAGES" || true
          done
