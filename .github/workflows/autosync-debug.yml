name: AutoSync CI

on:
  push:
    branches:
      - subtitle-autosync
    paths:
      - "app/**"
      - "nuvio-exoplayer-engine/**"
      - "ffmpeg-decoder-downmix/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/autosync-debug.yml"

  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build installable APK"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: autosync-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: AutoSync build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local properties
        run: |
          touch local.properties
          touch local.dev.properties

      - name: Configure persistent AutoSync signing
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOSYNC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AUTOSYNC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTOSYNC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AUTOSYNC_KEY_PASSWORD }}
        run: |
          set -e

          KEYSTORE_PATH="$RUNNER_TEMP/autosync-release.jks"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          {
            echo "NUVIO_RELEASE_STORE_FILE=$KEYSTORE_PATH"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Fast Kotlin compile check
        run: |
          ./gradlew \
            :app:compileFullDebugKotlin \
            --build-cache \
            --stacktrace

      - name: Build installable APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk
        run: |
          ./gradlew \
            :app:assembleFullDebug \
            --build-cache \
            --stacktrace

      - name: Upload universal APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_apk
        uses: actions/upload-artifact@v4
        with:
          name: NuvioTV-AutoSync-debug
          path: app/build/outputs/apk/full/debug/app-full-universal-debug.apk
          if-no-files-found: error
          retention-days: 7
