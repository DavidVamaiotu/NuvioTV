name: Backfill AutoSync release changelogs

on:
  push:
    branches:
      - subtitle-autosync
    paths:
      - ".github/workflows/backfill-autosync-release-changelogs-2026-09-24.yml"

permissions:
  contents: write

jobs:
  backfill-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AutoSync branch
        uses: actions/checkout@v6
        with:
          ref: subtitle-autosync
          fetch-depth: 0
      - name: Update generic release descriptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/autosync-notes-1.md <<'AUTOSYNC_NOTES_1'
          ## AutoSync TV changelog
          
          - Released the existing AutoSync V2 implementation on the official NuvioTV 1.1.0-beta.1 base.
          - No net application-source changes compared with 1.1.0-beta.1-autosync.3. The intervening commits added, fixed, and removed a one-time release-changelog updater and created this release revision.
          - PGS reference handling, matching, confidence checks, and retiming remain as in 1.1.0-beta.1-autosync.3.
          
          Based on official NuvioTV 1.1.0-beta.1.
          AUTOSYNC_NOTES_1
          cat > /tmp/autosync-expected-1.md <<'AUTOSYNC_EXPECTED_1'
          AutoSync TV revision 1.1.0-beta.1-autosync.4 based on official NuvioTV 1.1.0-beta.1. Includes AutoSync V2.
          AUTOSYNC_EXPECTED_1
          current="$(gh release view '1.1.0-beta.1-autosync.4' --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [[ "$current" == "$(cat /tmp/autosync-expected-1.md)" ]]; then
            gh release edit '1.1.0-beta.1-autosync.4' --repo "$GITHUB_REPOSITORY" --notes-file /tmp/autosync-notes-1.md
          elif [[ "$current" == "$(cat /tmp/autosync-notes-1.md)" ]]; then
            echo "Already updated: 1.1.0-beta.1-autosync.4"
          else
            echo "::error::Unexpected release body for 1.1.0-beta.1-autosync.4; refusing to overwrite."
            exit 1
          fi
          cat > /tmp/autosync-notes-2.md <<'AUTOSYNC_NOTES_2'
          ## AutoSync TV changelog
          
          - Added debug-only, replayable timing dumps for evaluated subtitle and embedded-reference cue timelines.
          - Improved matched-group anchoring by replacing a timing outlier with the median of its seven-group neighborhood, avoiding snaps to mis-paired lines.
          - Cross-checked independent embedded-reference sources before matching, excluding a mistimed source when two other independent sources agree.
          - Added regression tests for reference consistency, timeline retiming, and timing-dump replay.
          
          Based on official NuvioTV 1.1.0-beta.1.
          AUTOSYNC_NOTES_2
          cat > /tmp/autosync-expected-2.md <<'AUTOSYNC_EXPECTED_2'
          AutoSync TV revision 1.1.0-beta.1-autosync.5 based on official NuvioTV 1.1.0-beta.1. Includes AutoSync V2.
          AUTOSYNC_EXPECTED_2
          current="$(gh release view '1.1.0-beta.1-autosync.5' --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [[ "$current" == "$(cat /tmp/autosync-expected-2.md)" ]]; then
            gh release edit '1.1.0-beta.1-autosync.5' --repo "$GITHUB_REPOSITORY" --notes-file /tmp/autosync-notes-2.md
          elif [[ "$current" == "$(cat /tmp/autosync-notes-2.md)" ]]; then
            echo "Already updated: 1.1.0-beta.1-autosync.5"
          else
            echo "::error::Unexpected release body for 1.1.0-beta.1-autosync.5; refusing to overwrite."
            exit 1
          fi
          cat > /tmp/autosync-notes-3.md <<'AUTOSYNC_NOTES_3'
          ## AutoSync TV changelog
          
          - Evaluate subtitle candidates in their displayed list order instead of alternating between the beginning and end.
          - Stop a candidate's remaining reference comparisons after three independent embedded-reference sources all produce a clear no-fit result, reducing unnecessary matching work.
          - Preserve near misses and candidates with any confident match; near-identical track variants count as one independent reference.
          - Matching confidence thresholds and timeline-retiming behavior are unchanged.
          
          Based on official NuvioTV 1.1.0-beta.1.
          AUTOSYNC_NOTES_3
          cat > /tmp/autosync-expected-3.md <<'AUTOSYNC_EXPECTED_3'
          AutoSync TV revision 1.1.0-beta.1-autosync.6 based on official NuvioTV 1.1.0-beta.1. Includes AutoSync V2.
          AUTOSYNC_EXPECTED_3
          current="$(gh release view '1.1.0-beta.1-autosync.6' --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [[ "$current" == "$(cat /tmp/autosync-expected-3.md)" ]]; then
            gh release edit '1.1.0-beta.1-autosync.6' --repo "$GITHUB_REPOSITORY" --notes-file /tmp/autosync-notes-3.md
          elif [[ "$current" == "$(cat /tmp/autosync-notes-3.md)" ]]; then
            echo "Already updated: 1.1.0-beta.1-autosync.6"
          else
            echo "::error::Unexpected release body for 1.1.0-beta.1-autosync.6; refusing to overwrite."
            exit 1
          fi
      - name: Remove one-time updater
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- '.github/workflows/backfill-autosync-release-changelogs-2026-09-24.yml'
          git commit -m "Remove one-time AutoSync release-changelog updater"
          git push origin HEAD:subtitle-autosync
